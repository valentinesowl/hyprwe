# themes/mono/theme.toml — monochrome Swiss restraint.
# Neutral black/white surfaces, geometric grotesque type and no chromatic accent.
# State remains legible through luminance, text markers and the workspace underline.

name = "Mono"

[palette]
black = "#050505"
white = "#f5f5f5"
grey  = "#8a8a8a"

[sem]
# surfaces (dark -> light): neutral near-black, without a coloured tint
bg_dark    = "#050505"
bg_normal  = "#0a0a0a"
bg_light   = "#121212"
bg_lighter = "#1b1b1b"
# text (dim -> max contrast): every ink clears small-text contrast on the bar
fg_dim     = "#8a8a8a"
fg_normal  = "#b5b5b5"
fg_bright  = "#e6e6e6"
fg_white   = "#ffffff"
# accent — paper-white ink; selected fills automatically take near-black text
accent      = "#f5f5f5"
accent_soft = "#bcbcbc"
# raw colours — a deliberate grayscale ladder, not missing colour definitions
red     = "#eeeeee"
green   = "#d6d6d6"
yellow  = "#bebebe"
orange  = "#a6a6a6"
blue    = "#969696"
magenta = "#898989"
cyan    = "#7c7c7c"
# service
border = "#2e2e2e"
urgent = "#ffffff"

[params]
scheme        = "dark"
font          = "GeistMono Nerd Font"
rounding      = 6
gaps_in       = 6
gaps_out      = 12
border_size   = 1
# Medium window glass; the slightly denser bar preserves small-text contrast.
opacity       = 0.85
bar_opacity   = 0.90
blur_passes   = 2
blur_size     = 4
bar_height    = 28
bar_float     = false
bar_gap       = 6
bar_gap_x     = 8
bar_radius    = 10
bar_ws_indicator = "underline"
bar_ws_speed     = 220

[font]
family          = "GeistMono Nerd Font"
icon_family     = "Symbols Nerd Font Mono"
fallback_family = "JetBrains Mono"
ui_family       = "Noto Sans"
terminal        = 9.5
bar             = 12
launcher        = 12
notify          = 11
gtk             = 11

[wallpaper]
style     = "mesh"
intensity = 0.35
animated  = true
